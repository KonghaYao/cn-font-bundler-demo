<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixiJS 示例</title>
    <link rel='stylesheet' href='https://chinese-fonts-cdn.deno.dev/packages/yzgcxst/dist/也字工厂小石头/result.css' />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #pixiCanvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <script type="module">
        import {Application, Container, Text} from 'https://unpkg.com/pixi.js@7/dist/pixi.min.mjs';

        (async () => {
            const app = new Application({
                backgroundColor: 0x1099bb
            });
            document.body.appendChild(app.view);
            const text = new Text('中文网字', {
                fontFamily: 'YEFONTXiaoShiTou'
            })
            text.anchor.set(0.5);
            text.x = app.renderer.width / 2;
            text.y = app.renderer.height / 2;

            const container = new Container();
            container.addChild(text)
            app.stage.addChild(container);
            document.fonts.onloadingdone = () => {
                updateTextElements(app.stage)
            };
            function updateTextElements(stage) {
                function traverseChildren(container) {
                    container.children.forEach(child => {
                        if (child instanceof Text) {
                            child.updateText();
                        }
                        if (child.children && child.children.length > 0) {
                            traverseChildren(child);
                        }
                    });
                }
                traverseChildren(stage);
            }
        })();

    </script>
</body>

</html>
